name: Release

# git tag v0.1.1
#           │
#           ▼
#         guard ......... the tag must match Cargo.toml
#           │
#           ▼
#        verify ......... the whole CI suite, on all three platforms, plus the
#           │             bypass attacks in a container. Nothing is built until
#           │             this is green.
#     ┌─────┴─────┬───────────┬───────────┬───────────┐
#     ▼           ▼           ▼           ▼           ▼
#  linux-x64  linux-arm64  macos-arm  macos-x64  windows-x64
#     └───────────┴─────┬─────┴───────────┴───────────┘
#                       ▼
#              GitHub release + binaries
#                       │
#                     approve ....... one manual gate, all three are permanent
#                       │
#         ┌─────────────┼─────────────┐
#         ▼             ▼             ▼
#      crates.io       npm           PyPI
#     ralon crate   ralon + five   ralonlock
#                   @stoneware-dev  wheels
#
# npm and PyPI ship the *same* binaries this workflow built, not a second
# compile of the same source.
#
# Every arrow is a hard dependency: a failure anywhere above stops everything
# below it, and the manual gate is the last thing rather than the only thing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag that disagrees with Cargo.toml would publish artifacts under a version
  # that does not exist on crates.io. Catch it before anything is built.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag must match the crate version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi
          echo "releasing v$version"

  # The same jobs a pull request runs — `cargo fmt`, `clippy -D warnings`,
  # `cargo test` on Linux, macOS and Windows, and the real bypass attempts in a
  # permissive container. Reused from `ci.yml` rather than restated, so the two
  # cannot drift apart and quietly disagree about what "tested" means.
  #
  # It runs *before* `binaries` rather than beside it. Compiling five targets
  # from a commit whose tests fail wastes ten minutes and produces artifacts
  # nobody should be able to approve.
  verify:
    needs: guard
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: verify
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl for Linux: a static binary with no glibc version to match,
          # which is what makes it safe to drop into any container.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          # `run` refuses on these, but `check` and `status` are what mixed
          # teams need in CI and pre-commit hooks.
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }
          - { os: macos-latest, target: x86_64-apple-darwin, cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, cross: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Cross-compiling to aarch64 musl needs a toolchain the runner does not
      # have; cross supplies one in a container.
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      # Two outputs from one binary: an archive for humans and the GitHub
      # release, and a bare binary for the npm and PyPI packagers.
      - name: Package
        shell: bash
        run: |
          executable=ralon
          [ "${{ runner.os }}" = "Windows" ] && executable=ralon.exe

          mkdir -p "artifacts/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/$executable" "artifacts/${{ matrix.target }}/"

          staging="ralon-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/$executable" "$staging/"
          # Apache-2.0 asks redistributors to carry the licence, and nobody
          # should run this without the chance to read what it does and does
          # not guarantee.
          cp README.md LICENSE security.md "$staging/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="$staging.zip"
            7z a "$archive" "$staging" > /dev/null
          else
            archive="$staging.tar.gz"
            tar czf "$archive" "$staging"
          fi

          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Hand the binary to the packaging jobs
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: artifacts
          retention-days: 1

      # Archive names follow cargo-binstall's default convention, so
      # `cargo binstall ralon` finds them without extra metadata.
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            `run` enforces on Linux only. The macOS and Windows binaries provide
            `init`, `check` and `status`, which is what CI and pre-commit hooks
            need.

            Verify a download against its `.sha256` before trusting it, and read
            `security.md` for what the guarantee covers — and what it does not.

  # One gate for all three registries. Every one of them is effectively
  # append-only, so a mistaken tag is not something to find out about
  # afterwards.
  #
  # This job is only a gate if the `release` environment has a **required
  # reviewer** configured under Settings → Environments. Without one it runs
  # straight through and publishes unattended — the workflow file cannot enforce
  # that on its own, which is why it is written down here and printed below.
  approve:
    needs: binaries
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Written to the step summary so the reviewer is deciding against
      # something. Approving a job whose only output is the tag it already knew
      # is a rubber stamp with extra steps.
      - name: What approving this will publish
        shell: bash
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          {
            echo "## Publishing v$version"
            echo
            echo "Tests passed on Linux, macOS and Windows, and the bypass"
            echo "attacks ran in a container. Five binaries built."
            echo
            echo "| Registry | Package | Reversible? |"
            echo "| --- | --- | --- |"
            echo "| crates.io | \`ralon\` $version | no — yank hides it, the version is spent |"
            echo "| npm | \`ralonlock\` + 5 \`@stoneware-dev/*\` | no — unpublish is limited to 72 hours |"
            echo "| PyPI | \`ralonlock\` $version, 5 wheels | no — the filename can never be reused |"
            echo
            echo "Check before approving:"
            echo "- \`CHANGELOG.md\` has a $version section that matches what shipped"
            echo "- the GitHub release notes above read correctly"
            echo "- \`security.md\` covers any new limitation this release introduces"
          } >> "$GITHUB_STEP_SUMMARY"

  crates-io:
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: node packaging/build-npm.mjs --version "${GITHUB_REF#refs/tags/}" --binaries artifacts --out dist

      # Platform packages first: the package users install lists them as
      # optionalDependencies, and npm cannot install it until they resolve.
      #
      # Skipping versions that are already up makes this re-runnable. npm
      # publishes one package at a time, so a failure on the last one used to
      # leave the job unable to retry: the earlier packages would be rejected
      # as duplicates.
      - name: Publish
        shell: bash
        run: |
          publish() {
            directory="$1"
            name=$(node -p "require('$PWD/$directory/package.json').name")
            version=$(node -p "require('$PWD/$directory/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              # The leading ./ is load-bearing: npm parses a bare `dist/ralon`
              # as the GitHub shorthand user/repo and tries to clone it. Paths
              # with three segments happen to escape that, which is why the
              # platform packages published and this one did not.
              npm publish --access public "./$directory"
            fi
          }

          for package in dist/platforms/*; do
            publish "$package"
          done
          publish dist/ralon
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's identity, so there is
      # no long-lived token to leak.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python packaging/build-wheels.py --version "${GITHUB_REF#refs/tags/}" --binaries artifacts --out dist
      - uses: pypa/gh-action-pypi-publish@release/v1
