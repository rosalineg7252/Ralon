[package]
# The policy file stays `agent.lock`: it is the format, and `ralon` is one tool
# that enforces it. Every descriptive name in this space was taken.
name = "ralon"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "Filesystem policy for AI coding agents: kernel-enforced write protection driven by an agent.lock file"
license = "Apache-2.0"
repository = "https://github.com/stoneware-dev/Ralon"
readme = "README.md"
keywords = ["ai", "agent", "sandbox", "landlock", "security"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ralon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
walkdir = "2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
