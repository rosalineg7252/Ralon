[package]
# The policy file stays `agent.lock`: it is the format, and `ralon` is one tool
# that enforces it. Every descriptive name in this space was taken.
name = "ralon"
version = "0.1.7"
edition = "2021"
# Verified, not guessed: 1.79 was declared and had not been buildable for some
# time — `clap_lex` now needs edition 2024 and `globset` needs 1.88, so an
# older toolchain failed with a dependency's error rather than a clear "this
# crate needs a newer Rust". Checked against 1.79, 1.85 and 1.88 in turn.
rust-version = "1.88"
description = "Filesystem policy for AI coding agents: kernel-enforced write protection driven by an agent.lock file"
license = "Apache-2.0"
repository = "https://github.com/stoneware-dev/Ralon"
readme = "README.md"
keywords = ["ai", "agent", "sandbox", "landlock", "security"]
categories = ["command-line-utilities", "development-tools"]
# Crate users get the tool, its tests, and the documentation that explains what
# it does and does not guarantee — not the release plumbing.
exclude = [
    ".github/",
    "npm/",
    "packaging/",
    "dist/",
    "artifacts/",
    "publishing.md",
    "claude.md",
    "agent.lock",
]

[[bin]]
name = "ralon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
# macOS needs it for `chflags` and `stat`, Linux for `signal` and the Landlock
# syscalls. One entry rather than two identical ones.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
